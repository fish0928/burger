<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seasoning Zone – Add Sauce</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      background-image: url('static/A_2D_digital_illustration_features_a_semi-transpar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000000;
      font-size: 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      font-size: 24px;
      margin: 20px 0;
    }

    button {
      margin: 10px;
      padding: 12px 24px;
      font-size: 24px;
      cursor: pointer;
    }

    img {
      display: block;
      margin: 20px auto;
      width: 150px;
    }

    a {
      color: #ffeb3b;
      font-size: 20px;
      text-decoration: none;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Seasoning Zone</h1>
  <p>The customer hates spicy. Add hot sauce?</p>

  <img id="pourImg" src="static/pour.png" style="display:none;" alt="Pouring Sauce">

  <audio id="pourSound" src="static/pour.mp3"></audio>

  <button onclick="pour('no')">No</button>
  <button onclick="pour('yes')">Yes</button>

  <p><a href="index.html">← Back to Map</a></p>

  <script>
    function pour(ans) {
      if (ans === 'yes') {
        const img = document.getElementById('pourImg');
        img.style.display = 'block';
        document.getElementById('pourSound').play();
        setTimeout(() => window.location.href = 'index.html', 2000);
      } else {
        alert('No sauce added.');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
