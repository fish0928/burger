<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seasoning Zone – Add Sauce</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('static/A_2D_digital_illustration_features_a_semi-transpar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000000;
      font-size: 26px;
      text-align: center;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 20px;
    }

    p {
      font-size: 30px;
      margin: 20px 0;
    }

    button {
      margin: 10px 20px;
      padding: 14px 28px;
      font-size: 28px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: rgba(0,0,0,0.6);
      color: #ffeb3b;
    }

    button:hover {
      background-color: rgba(0,0,0,0.8);
    }

    img {
      display: block;
      margin: 30px auto;
      width: 200px;
    }

    a {
      color: #ffeb3b;
      font-size: 24px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 30px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Seasoning Zone</h1>
  <p>The customer hates spicy. Add hot sauce?</p>

  <img id="pourImg" src="static/pour.png" style="display:none;" alt="Pouring Sauce">

  <audio id="pourSound" src="static/pour.mp3"></audio>

  <div>
    <button onclick="pour('no')">No</button>
    <button onclick="pour('yes')">Yes</button>
  </div>

  <p><a href="index.html">← Back to Map</a></p>

  <script>
    function pour(ans) {
      if (ans === 'yes') {
        const img = document.getElementById('pourImg');
        img.style.display = 'block';
        document.getElementById('pourSound').play();
        setTimeout(() => window.location.href = 'index.html', 2000);
      } else {
        alert('No sauce added.');
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
