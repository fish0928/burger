<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fridge Zone – Select Ingredients</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background-image: url('static/A_2D_digital_illustration_features_a_semi-transpar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000000;
      font-size: 20px;
    }

    label {
      display: block;
      margin: 10px 0;
      font-size: 24px;
    }

    button {
      margin-top: 15px;
      padding: 10px 15px;
      font-size: 20px;
    }

    img {
      vertical-align: middle;
      width: 60px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>Fridge Zone</h1>
  <p><strong>Burger Bun</strong> and <strong>Meat Patty</strong> are already included.</p>
  <p>Select exactly 2 more ingredients:</p>

  <form id="form">
    <label><input type="checkbox" name="ing" value="Tomato"> Tomato <img src="static/tomato.png" alt="Tomato"></label>
    <label><input type="checkbox" name="ing" value="Cheese"> Cheese <img src="static/cheese.png" alt="Cheese"></label>
    <label><input type="checkbox" name="ing" value="Lettuce"> Lettuce <img src="static/lettuce.png" alt="Lettuce"></label>
    <label><input type="checkbox" name="ing" value="Cucumber"> Cucumber <img src="static/cucumber.png" alt="Cucumber"></label>
  </form>

  <audio id="confirmSound" src="static/confirm.mp3"></audio>

  <button type="button" onclick="submitForm()">Submit</button>
  <p><a href="index.html" style="color: #ffeb3b; font-weight: bold;">← Back to Map</a></p>

  <script>
    function submitForm() {
      const fixed = ['Burger Bun', 'Meat Patty'];
      const selected = Array.from(
        document.querySelectorAll('input[name="ing"]:checked')
      ).map(cb => cb.value);

      if (selected.length !== 2) {
        alert('Please pick exactly 2 additional ingredients.');
        return;
      }

      const combo = [...fixed, ...selected];
      localStorage.setItem('ingredients', JSON.stringify(combo));
      document.getElementById('confirmSound').play();
    }
  </script>
</body>
</html>
