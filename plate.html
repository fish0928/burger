<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plating Zone – Build Burger</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('static/A_2D_digital_illustration_features_a_semi-transpar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000000;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 20px;
    }

    #assembleBtn {
      padding: 16px 32px;
      font-size: 28px;
      cursor: pointer;
      margin-bottom: 30px;
      border: none;
      border-radius: 8px;
      background-color: rgba(0,0,0,0.6);
      color: #ffeb3b;
    }

    #assembleBtn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #burgerImg {
      display: none;
      width: 250px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #completeText {
      display: none;
      font-size: 42px;
      font-weight: bold;
      text-align: center;
    }

    a {
      margin-top: 40px;
      font-size: 22px;
      color: #ffeb3b;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Plating Zone</h1>

  <button id="assembleBtn">Assemble Burger</button>

  <img id="burgerImg" src="static/burger_complete.png" alt="Completed Burger" />
  <p id="completeText">All done! Great job!</p>

  <a href="index.html">← Back to Map</a>

  <script>
    const btn = document.getElementById('assembleBtn');
    const img = document.getElementById('burgerImg');
    const text = document.getElementById('completeText');

    btn.addEventListener('click', () => {
      img.style.display = 'block';
      text.style.display = 'block';
      btn.disabled = true;
    });
  </script>
</body>
</html>
