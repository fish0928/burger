<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plating Zone – Build Burger</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      background-image: url('static/A_2D_digital_illustration_features_a_semi-transpar.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      text-shadow: 1px 1px 3px #000000;
      font-size: 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    p {
      font-size: 24px;
      margin: 20px 0;
    }

    #burgerImg {
      display: none; /* Initially hidden */
      margin: 30px auto;
      width: 200px;
    }

    #doneMsg {
      display: none; /* Initially hidden */
      font-size: 28px;
      margin-top: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 24px;
      margin: 20px;
      cursor: pointer;
    }

    a {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      font-size: 20px;
      text-decoration: none;
      color: #ffeb3b;
      font-weight: bold;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Plating Zone</h1>
  <p>Click the button to assemble your burger:</p>

  <button id="assembleBtn">Assemble Burger</button>
  <img
    id="burgerImg"
    src="static/burger_complete.png"
    alt="Completed Burger"
  />
  <p id="doneMsg">All done! Great job!</p>

  <p><a href="index.html">← Back to Map</a></p>

  <script>
    document.getElementById('assembleBtn').addEventListener('click', () => {
      document.getElementById('burgerImg').style.display = 'block';
      document.getElementById('doneMsg').style.display = 'block';
      document.getElementById('assembleBtn').disabled = true;
    });
  </script>
</body>
</html>
